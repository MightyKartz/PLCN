name: Prepare desktop release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/desktop.yml

  release-draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RetroArchAssistant-*-unsigned
          merge-multiple: true
          path: release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          name: 'RetroArch Assistant ${{ github.ref_name }}'
          body_path: RELEASE_PREVIEW.md
          files: release-artifacts/*
