name: Prepare desktop release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/desktop.yml

  release-draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PLCN-*-unsigned
          merge-multiple: true
          path: release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          name: 'PLCN ${{ github.ref_name }}'
          body: |
            Download a matching installer below; no Python, Node.js or Xcode needed.
            Windows/macOS packages include ADB. Android USB debugging authorization
            and, for some Windows devices, vendor USB drivers are still required.

            These CI packages are not distribution-signed; macOS is not notarized.
            First-launch security restrictions may apply. See README installation notes.

            Chinese game titles can be searched against the official artwork gallery;
            candidates are graded by match quality and are only written after an
            explicit click. The playlist image column reports cover, snap and title
            screen status separately. Backups stay outside the playlists folder.

            中文游戏名可直接搜索官方图库，候选按匹配可靠度分级，必须手动点选后才会写入；
            游戏列表的图片列分别显示封面、游戏截图、标题图的状态。
          files: release-artifacts/*
