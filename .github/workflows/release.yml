name: Prepare desktop release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/desktop.yml

  release-draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RetroArchAssistant-*-unsigned
          merge-multiple: true
          path: release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          name: 'RetroArch Assistant ${{ github.ref_name }}'
          body: |
            RetroArch Assistant — scan games, organize playlists and complete names/artwork.
            RetroArch 助手：扫描游戏、整理列表、补全资料，管理你的掌机游戏库。

            Open your handheld, SD card or local library. Scan new games to preview incremental
            playlist additions, complete names and artwork for existing lists, or add directories
            manually. Tools include disc lists, CHD conversion, ROM organization and recovery.
            Task details, retry and cancellation are available from the top-right task icon.

            Existing PLCN settings, backups and recovery records remain compatible. The plcn CLI,
            PLCN_HOME and application IDs are preserved. No ROM files are moved by rebranding.

            Download a matching installer below; no Python, Node.js or Xcode is needed.
            Packages include ADB. Android authorization and vendor drivers may still be required.
            Windows/macOS packages are not distribution-signed; macOS is not notarized.
            See README installation notes for system security and device connection details.
          files: release-artifacts/*
