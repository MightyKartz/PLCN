name: Prepare desktop release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/desktop.yml

  release-draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PLCN-*-unsigned
          merge-multiple: true
          path: release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          name: 'PLCN ${{ github.ref_name }}'
          body: |
            Download a matching installer below; no Python, Node.js or Xcode needed.
            Windows/macOS packages include ADB. Android USB debugging authorization
            and, for some Windows devices, vendor USB drivers are still required.

            These CI packages are not distribution-signed; macOS is not notarized.
            First-launch security restrictions may apply. See README installation notes.

            Includes DOS artwork aliases/alternate-source previews and same-disc
            playlist companion cleanup. Backups stay outside the playlists folder.
          files: release-artifacts/*
