name: Prepare desktop release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/desktop.yml

  release-draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PLCN-*-unsigned
          merge-multiple: true
          path: release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          name: '${{ github.ref_name }} desktop preview (unsigned)'
          body: |
            Windows installer/portable ZIP and macOS Intel/Apple Silicon DMGs.
            These are unsigned preview artifacts. Complete signing/notarization and
            manual installation/file-picker/device validation before a public stable release.
            See DOC/DESKTOP_GUIDE.md for the release checklist.
          files: release-artifacts/*
