name: Android storage probe

on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/playlist_manager.py'
      - 'src/safe_io.py'
      - '.github/workflows/android-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build ARM64 storage probe
        run: ./android/gradlew -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RetroArchAssistant-Android-arm64-storage-probe
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
