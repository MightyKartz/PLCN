name: Regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      # This runner must execute the real browser tests, never silently skip them.
      PLCN_REQUIRE_BROWSER: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.13' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q -rs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke-${{ matrix.os }}-python-${{ matrix.python }}
          path: output/playwright/browser-smoke/
          if-no-files-found: ignore
      - run: python -m compileall -q src
      - run: python scripts/check_ui_js.py
      - run: git diff --exit-code
